name: Release

# Publishing is driven by a GitHub Release. Creating one as a pre-release routes the
# upload to a non-default Marketplace channel, so a beta reaches only people who opted
# into it.
on:
  release:
    types: [prereleased, released]
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build, verify and sign, but do not publish"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-disabled: true # see the note on caching below

      # Nothing below is worth doing if the tag and the version disagree: publishing
      # 0.1.0 from a tag that says v0.2.0 is silent and very hard to undo.
      - name: Check the tag matches pluginVersion
        if: github.event_name == 'release'
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          tag="${{ github.event.release.tag_name }}"
          echo "pluginVersion=$version  tag=$tag"
          if [ "v$version" != "$tag" ] && [ "$version" != "$tag" ]; then
            echo "::error::Tag $tag does not match pluginVersion $version"
            exit 1
          fi

      - name: Check the changelog has an entry for this version
        if: github.event_name == 'release'
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          if ! grep -qE "^## \[($version|Unreleased)\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      # A release must not be able to ship something the normal pipeline would reject.
      - name: Test
        run: ./gradlew check --stacktrace

      # Deliberately uncached. The Actions cache is shared across refs, so restoring
      # one in the job that signs and publishes would let anyone able to poison it
      # from a lower-privileged run influence what ships. Releases are rare; paying
      # the download each time is the right trade. build.yml keeps its cache.
      # The Plugin Verifier downloads a full IDE per target — 1-2 GB each — which
      # overruns a runner's free disk long before the matrix finishes. Reclaiming the
      # preinstalled toolchains we do not use buys roughly 25 GB.
      - name: Free disk space
        run: |
          df -h / | tail -1
          # Not $AGENT_TOOLSDIRECTORY: setup-java installs the JDK there, and
          # removing it leaves JAVA_HOME pointing at nothing.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune --all --force || true
          df -h / | tail -1

      - name: Verify plugin
        run: ./gradlew verifyPlugin --stacktrace

      # Signing needs credentials a dry run may not have. A dry run exists to prove
      # the pipeline before a real release depends on those secrets, so it must not
      # require them — it builds, and signs only when it can.
      - name: Check for signing credentials
        id: signing
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          if [ -n "$CERTIFICATE_CHAIN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing credentials; building unsigned. A real release must be signed."
          fi

      - name: Build
        run: ./gradlew buildPlugin --stacktrace

      - name: Sign
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin verifyPluginSignature --stacktrace

      # A published release must be signed. A dry run may legitimately be unsigned;
      # a real one may not, and failing here is far better than shipping unsigned.
      - name: Require signing for a real release
        if: github.event_name == 'release' && steps.signing.outputs.available != 'true'
        run: |
          echo "::error::Cannot publish: signing credentials are not configured."
          echo "Set CERTIFICATE_CHAIN, PRIVATE_KEY and PRIVATE_KEY_PASSWORD. See RELEASING.md."
          exit 1

      - name: Publish
        if: github.event_name == 'release' || inputs.dryRun == false
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin --stacktrace

      - name: Attach the signed artifact to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" ./build/distributions/*.zip --clobber

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
