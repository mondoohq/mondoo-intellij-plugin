name: Cut release

# Starts a release: bumps the version, closes the changelog, tags, and opens a draft
# release for a human to publish.
#
# It exists because doing this by hand went wrong. Tagging v0.2.0 while
# gradle.properties still said 0.1.0 failed release.yml's first gate — correctly, since
# publishing 0.1.0 under a v0.2.0 tag is silent and hard to undo — but only after a
# public release already existed. Here the bump is committed *before* the tag is
# created, so the two cannot disagree.
#
# It deliberately stops at a draft. Publishing is a separate, human action, for two
# reasons: it is the last point at which the notes can be read before anything is
# public, and a release created by GITHUB_TOKEN does not trigger other workflows —
# release.yml would never run, and the release would sit there with no binary attached,
# which is the exact failure this workflow is meant to prevent.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.3.0 or 1.0.0-beta.1"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (routes to a non-default Marketplace channel)"
        type: boolean
        default: false

concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Bump, tag and draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0 # tags, so the already-released check can see them

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      # Before anything is written. Re-cutting an existing version would either move a
      # published tag or fail confusingly half way through.
      - name: Check this version is not already released
        run: |
          tag="v${{ inputs.version }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::$tag already exists. Pick a new version, or delete the tag and its release first."
            exit 1
          fi

      # Validates the version, bumps gradle.properties, closes the changelog, and
      # verifies both landed. Same script a human can run locally.
      - name: Bump the version
        run: scripts/bump-version.sh "${{ inputs.version }}"

      # A release must not ship something the normal pipeline would reject, and finding
      # that out after the tag exists is how this went wrong last time.
      - name: Test
        run: ./gradlew check --stacktrace

      - name: Commit and tag
        run: |
          version="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$version"
          # main first, then the tag on that commit — so the tag can never point at a
          # commit whose pluginVersion disagrees with it.
          git push origin main
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"

      - name: Open a draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ inputs.version }}"
          # The notes are the changelog section just written, so the release and the
          # repository cannot describe the version differently.
          ./gradlew getChangelog --no-header --no-summary --quiet > /tmp/notes.md
          {
            echo "**Requires an IntelliJ-based IDE 2026.1.4 or newer.** Tested on IntelliJ IDEA, GoLand and Android Studio."
            echo
            echo "Not on the JetBrains Marketplace yet — download the ZIP below and install it with"
            echo "**Settings → Plugins → ⚙ → Install Plugin from Disk…**, then restart."
            echo
            echo "---"
            echo
            cat /tmp/notes.md
          } > /tmp/release-notes.md

          gh release create "v$version" \
            --title "v$version" \
            --notes-file /tmp/release-notes.md \
            --draft \
            --target main

          # Applied separately rather than interpolated: --prerelease is a valueless
          # flag, so there is no way to conditionally include it on the line above.
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            gh release edit "v$version" --prerelease
          fi

      - name: Summarise
        if: always()
        run: |
          version="${{ inputs.version }}"
          {
            echo "## Draft release v$version"
            echo
            echo "The version is bumped, the changelog is closed, and \`v$version\` is tagged."
            echo
            echo "**Publish the draft release to finish.** Publishing is what triggers the"
            echo "build that attaches the plugin ZIP — a release created by this workflow's"
            echo "token cannot trigger it, which is why the last step is yours."
            echo
            echo "Read the notes first; they come from CHANGELOG.md."
          } >> "$GITHUB_STEP_SUMMARY"
