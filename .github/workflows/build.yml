name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A full run is nine jobs and about 27 wall-clock minutes, but the bill is weighted:
  # macOS runners cost 10x and Windows 2x, so it is nearer 90 billable minutes, two
  # thirds of it macOS. None of that tells you anything about a change to a README or a
  # release workflow, and PR #6 — one line of YAML permissions — paid all of it.
  #
  # So the expensive jobs are gated on whether the change can affect the plugin. The
  # list below is an allowlist of things that cannot; everything else, including
  # build.yml itself and the composite action, counts as code. Defaulting to "run
  # everything" means a path nobody thought about gets tested rather than silently
  # skipped.
  #
  # Gated with `if:` rather than a workflow-level paths filter on purpose: a skipped job
  # still reports a status, so branch protection is satisfied, whereas a filtered-out
  # workflow never reports at all and a required check would wait forever.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # both sides of the comparison

      - name: Decide whether this touches the plugin
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # A new branch, a force push, or a manual run leaves no usable base. Test
          # everything rather than guess.
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "No usable base commit; running everything."
            echo "plugin=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" "$head")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'

          plugin=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|.github/images/*|.github/ISSUE_TEMPLATE/*|LICENSE|CODEOWNERS) ;;
              # Dependabot's own configuration cannot change what the plugin does.
              # Note that what Dependabot *opens* is not exempt: a version-catalog bump
              # falls through to the catch-all and runs the full matrix, which is the
              # whole point of having it open those pull requests.
              .github/dependabot.yml) ;;
              # The release workflows run their own tests and verifier when they fire;
              # build.yml never validated them.
              .github/workflows/release-*.yml) ;;
              *) plugin=true; echo "  -> $f affects the plugin"; break ;;
            esac
          done <<< "$changed"

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          if [ "$plugin" = "false" ]; then
            echo "::notice::No plugin sources changed; skipping the build, smoke and verify jobs."
          fi

  # The plugin is built and installed on all three desktop platforms, so it is built
  # and tested on all three. Linux alone would miss what actually differs: resolving
  # xgrep.exe rather than xgrep, unpacking a .zip rather than a .tar.gz, looking in
  # Chocolatey, WinGet and Scoop, and keeping a backslash intact through JSON and
  # YAML escaping.
  build:
    name: Build and test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # Git Bash on the Windows runner, so ./gradlew and the shell steps below are
    # written once rather than once per platform.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Linux only: it reclaims preinstalled Linux toolchains, and the other two
      # runners have room already.
      - uses: ./.github/actions/free-disk-space
        if: runner.os == 'Linux'

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Style before substance: a formatting failure should be the first thing you
      # see, not something you find after a six-minute build. Once is enough — the
      # answer cannot differ by platform.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: ./gradlew ktlintCheck --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure --stacktrace

      # Rule 1 of cross-IDE compatibility: no product-specific module dependency.
      # See DEVELOPMENT.md and docs/adr/0001.
      - name: Guard against product-specific dependencies
        if: runner.os == 'Linux'
        run: |
          if grep -nE '<depends>com\.intellij\.modules\.(java|python|go|php|ruby|rider|cidr|database)' \
               src/main/resources/META-INF/plugin.xml; then
            echo "::error::plugin.xml declares a product-specific module; this breaks all-IDE compatibility"
            exit 1
          fi

      # One artifact, from one platform. The plugin ZIP is pure JVM bytecode and
      # resources, so three would be three copies of the same file.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: runner.os == 'Linux'
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tests-report-${{ runner.os }}
          path: build/reports/tests

  # Starts a real IntelliJ IDEA with the plugin installed and reads its log. This is
  # the only check that exercises the plugin as a plugin — class loading, the optional
  # LSP module, extension points, service construction — rather than as a jar, and
  # until now it only ever ran on one developer's Mac.
  #
  # No scanner is installed here on purpose: the plugin never downloads one unasked,
  # so a runner has none, and the script skips the scanner assertions rather than
  # asserting something about the machine. What remains is what breaks on an untried
  # platform: whether the plugin loads and initialises at all.
  smoke:
    name: IDE smoke test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/free-disk-space
        if: runner.os == 'Linux'

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The IDE is a Swing application and needs a display. macOS and Windows runners
      # have one; a Linux runner does not, hence the virtual framebuffer.
      - name: Install a virtual display
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum scripts/smoke-test.sh runIde
          else
            scripts/smoke-test.sh runIde
          fi

      # The log is the entire evidence for this job, and a failure is unreadable
      # without it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: idea-log-${{ runner.os }}
          path: |
            .intellijPlatform/sandbox/mondoo-intellij-plugin/*/log/idea.log
            build/smoke-test.out
          if-no-files-found: warn

  # Runs alongside build and verify rather than after them: a security finding is
  # not a reason to hold up compile feedback, and vice versa.
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # required for diff-aware scanning on pull requests

      - name: Scan with xgrep
        uses: mondoohq/actions/xgrep@c38cfdf99da709760f58ff35aa5608688657f2f7 # v13.3.0
        with:
          path: .
          output-file: results.sarif
          # The demo asset is deliberately vulnerable — it exists so findings appear
          # on first run. Reporting it would train people to ignore this scan.
          #
          # No inner quotes around the pattern. The action word-splits `args` with
          # `read -ra`, which splits on whitespace without removing quotes, so
          # `'…/demo/**'` reaches xgrep with the apostrophes still attached and
          # matches nothing. That had been wrong since this was written and stayed
          # invisible: the scan is diff-aware, so the demo file was only ever scanned
          # once a pull request finally changed it.
          args: "--exclude src/main/resources/demo/**"
          # Gated below rather than here. The action's own gate counts findings that
          # the scan has already marked suppressed, so an inline `nogrep:` comment
          # cannot get a triaged false positive past it — see the step after this one.
          fail-on: "off"

      # The gate the action's `fail-on` should be. SARIF records a suppressed finding
      # with a `suppressions` array — the scan does mark ours, `kind: "inSource"` —
      # and the action's gate counts every error-level result without looking at it.
      # The effect is that turning `fail-on` on removes the only escape hatch for a
      # false positive, which is how this repository's first gated run went red on a
      # finding that had been triaged and suppressed a day earlier.
      #
      # Reported upstream. Delete this step and restore `fail-on: error` once the
      # action's gate reads `suppressions`.
      - name: Gate on unsuppressed findings
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f results.sarif ]; then
            echo "::warning::No SARIF file; nothing to gate on."
            exit 0
          fi

          total=$(jq '[.runs[].results[]?] | length' results.sarif)
          suppressed=$(jq '[.runs[].results[]? | select((.suppressions // []) | length > 0)] | length' results.sarif)
          blocking=$(jq '[.runs[].results[]?
            | select(.level == "error")
            | select((.suppressions // []) | length == 0)] | length' results.sarif)

          echo "findings: $total total, $suppressed suppressed, $blocking blocking"

          if [ "$blocking" -gt 0 ]; then
            jq -r '.runs[].results[]?
              | select(.level == "error")
              | select((.suppressions // []) | length == 0)
              | "  \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' results.sarif
            echo "::error::xgrep found $blocking unsuppressed error-level finding(s)"
            exit 1
          fi

      # Code scanning needs GitHub Advanced Security, which a private repository
      # without it cannot use — the upload fails with "Resource not accessible by
      # integration". That is an entitlement, not a security problem, so it must not
      # fail the job. It starts working on its own if Advanced Security is enabled.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: results.sarif
          category: xgrep

      # So the findings are readable regardless of where they can be uploaded.
      - name: Summarise findings
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo "No SARIF produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(jq '[.runs[].results[]] | length' results.sarif)
          {
            echo "## Security scan"
            echo
            if [ "$count" -eq 0 ]; then
              echo "No findings."
            else
              echo "$count finding(s):"
              echo
              echo "| Rule | File | Line |"
              echo "| --- | --- | --- |"
              jq -r '[.runs[].results[]][:50][] |
                "| `\(.ruleId // "?")` | \(.locations[0].physicalLocation.artifactLocation.uri // "?") | \(.locations[0].physicalLocation.region.startLine // "?") |"' \
                results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: security-scan-sarif
          path: results.sarif

  verify:
    name: Verify (${{ matrix.ide }}${{ matrix.eap && ' EAP' || '' }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One IDE per job. The verifier downloads a full IDE per target — 1-2 GB
        # each — and several of them exhaust a single runner's disk part-way through,
        # taking the runner down with them. A job each keeps every one in budget and
        # runs them in parallel.
        #
        # Two hosts, not the whole product family: IDEA is the unified distribution
        # the others are built from, and GoLand is the one here with no Java, Python
        # or Kotlin plugin, so it is where a product-specific dependency surfaces.
        # Android Studio is the third supported host but is not a resolvable
        # artifact, so it is verified locally — see DEVELOPMENT.md — not here.
        include:
          - ide: IU
          - ide: GO
          # The next IDE, before it ships. untilBuild is open, so the plugin claims
          # compatibility with releases that do not exist yet, and an EAP is the only
          # warning before one of them removes an API. 2026.3 EAP dropped a terminal
          # method this plugin called; nothing here noticed, and the Marketplace found
          # it and blocked the release.
          #
          # Allowed to fail. An EAP breaks for reasons outside this repository, so a red
          # here means "look before their GA", not "this pull request is wrong".
          - ide: IU
            version: "263.3889.65"
            eap: true
    # An EAP failure is information, not a broken pull request.
    continue-on-error: ${{ matrix.eap == true }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ matrix.ide }}-${{ matrix.version || 'default' }}-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}

      - name: Verify
        run: |
          ./gradlew verifyPlugin \
            -PverifyIde=${{ matrix.ide }} \
            ${{ matrix.version && format('-PverifyVersion={0}', matrix.version) || '' }} \
            --stacktrace

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: verifier-report-${{ matrix.ide }}-${{ matrix.version || 'default' }}
          path: build/reports/pluginVerifier
