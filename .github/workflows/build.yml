name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure --stacktrace

      # Rule 1 of cross-IDE compatibility: no product-specific module dependency.
      # See DEVELOPMENT.md and docs/adr/0001.
      - name: Guard against product-specific dependencies
        run: |
          if grep -nE '<depends>com\.intellij\.modules\.(java|python|go|php|ruby|rider|cidr|database)' \
               src/main/resources/META-INF/plugin.xml; then
            echo "::error::plugin.xml declares a product-specific module; this breaks all-IDE compatibility"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tests-report
          path: build/reports/tests

  verify:
    name: Plugin Verifier
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      # ~1 GB per IDE. This cache is the difference between an 8- and a 40-minute job.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}

      - name: Verify against the IDE matrix
        run: ./gradlew verifyPlugin --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verifier-report
          path: build/reports/pluginVerifier
