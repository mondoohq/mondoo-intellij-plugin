name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/free-disk-space
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      # Style before substance: a formatting failure should be the first thing you
      # see, not something you find after a six-minute build.
      - name: Check formatting
        run: ./gradlew ktlintCheck --stacktrace

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Verify plugin structure
        run: ./gradlew verifyPluginStructure --stacktrace

      # Rule 1 of cross-IDE compatibility: no product-specific module dependency.
      # See DEVELOPMENT.md and docs/adr/0001.
      - name: Guard against product-specific dependencies
        run: |
          if grep -nE '<depends>com\.intellij\.modules\.(java|python|go|php|ruby|rider|cidr|database)' \
               src/main/resources/META-INF/plugin.xml; then
            echo "::error::plugin.xml declares a product-specific module; this breaks all-IDE compatibility"
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-artifact
          path: build/distributions/*.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: tests-report
          path: build/reports/tests

  # Runs alongside build and verify rather than after them: a security finding is
  # not a reason to hold up compile feedback, and vice versa.
  scan:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # required to upload SARIF
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # required for diff-aware scanning on pull requests

      - name: Scan with xgrep
        uses: mondoohq/actions/xgrep@c38cfdf99da709760f58ff35aa5608688657f2f7 # v13.3.0
        with:
          path: .
          output-file: results.sarif
          # The demo asset is deliberately vulnerable — it exists so findings appear
          # on first run. Reporting it would train people to ignore this scan.
          args: "--exclude 'src/main/resources/demo/**'"
          # Report only for now. Turn this to 'error' once the findings on this
          # repository are triaged, so the gate starts from a clean baseline rather
          # than blocking the first pull request that touches an existing finding.
          fail-on: "off"

      # Code scanning needs GitHub Advanced Security, which a private repository
      # without it cannot use — the upload fails with "Resource not accessible by
      # integration". That is an entitlement, not a security problem, so it must not
      # fail the job. It starts working on its own if Advanced Security is enabled.
      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@5ba2889ada762081db2c4f32a729827dce632c7b # v3
        with:
          sarif_file: results.sarif
          category: xgrep

      # So the findings are readable regardless of where they can be uploaded.
      - name: Summarise findings
        if: always()
        run: |
          if [ ! -f results.sarif ]; then
            echo "No SARIF produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(jq '[.runs[].results[]] | length' results.sarif)
          {
            echo "## Security scan"
            echo
            if [ "$count" -eq 0 ]; then
              echo "No findings."
            else
              echo "$count finding(s):"
              echo
              echo "| Rule | File | Line |"
              echo "| --- | --- | --- |"
              jq -r '[.runs[].results[]][:50][] |
                "| `\(.ruleId // "?")` | \(.locations[0].physicalLocation.artifactLocation.uri // "?") | \(.locations[0].physicalLocation.region.startLine // "?") |"' \
                results.sarif
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: security-scan-sarif
          path: results.sarif

  verify:
    name: Verify (${{ matrix.ide }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One IDE per job. The verifier downloads a full IDE per target — 1-2 GB
        # each — and several of them exhaust a single runner's disk part-way through,
        # taking the runner down with them. A job each keeps every one in budget and
        # runs them in parallel.
        #
        # Two hosts, not the whole product family: IDEA is the unified distribution
        # the others are built from, and GoLand is the one here with no Java, Python
        # or Kotlin plugin, so it is where a product-specific dependency surfaces.
        # Android Studio is the third supported host but is not a resolvable
        # artifact, so it is verified locally — see DEVELOPMENT.md — not here.
        ide: [IU, GO]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.pluginVerifier
          key: plugin-verifier-${{ matrix.ide }}-${{ hashFiles('build.gradle.kts', 'gradle.properties') }}

      - name: Verify
        run: ./gradlew verifyPlugin -PverifyIde=${{ matrix.ide }} --stacktrace

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: verifier-report-${{ matrix.ide }}
          path: build/reports/pluginVerifier
