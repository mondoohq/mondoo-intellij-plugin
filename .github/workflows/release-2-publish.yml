name: Release 2 - publish

# Runs itself when a version bump reaches main. Tests, builds, signs, creates the tag
# and the GitHub Release with the plugin attached, and uploads to the Marketplace when
# the credentials for that exist.
#
# You do not run this one; you merge the PR that "Release 1 - prepare" opened. The
# trigger is the same shape cnspec uses — a version file changing on main — so the two
# repositories release the same way.
#
# The tag and the release are created here rather than by hand, and the version comes
# from gradle.properties rather than from anything anyone types. A tag and a
# pluginVersion that disagree is what broke the first v0.2.0 attempt; there is now only
# one place the version exists.
#
# Everything happens in one workflow on purpose. The obvious split — one workflow tags
# and releases, another reacts to `on: release` and builds — does not work with the
# token this repository has: a release created with GITHUB_TOKEN does not trigger
# another workflow, so the second would never run and the release would carry no
# plugin. cnspec avoids that with a GitHub App token (mondoo-mergebot), which is not
# granted to this repository. If it ever is, this can be split to match cnspec exactly.
#
# Two jobs, because they answer two different questions and only one needs credentials
# Mondoo may not have yet:
#
#   build    — is there an installable plugin, and is it on the release?
#   publish  — did it reach the JetBrains Marketplace?
#
# A release cut with no Marketplace secrets still gives people something to install:
# the ZIP on the GitHub Release, via "Install Plugin from Disk…". Publishing is then
# skipped and says so, rather than failing the release.
on:
  push:
    branches: [main]
    paths:
      # Only a version change can start a release, so nothing else need wake this.
      - gradle.properties
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Build, verify and sign, but do not tag, release or publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build, tag and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      signed: ${{ steps.signing.outputs.available }}
      publishable: ${{ steps.publishable.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags, so an already-released version is left alone

      # The Plugin Verifier downloads a full IDE — 1-2 GB — and this job is
      # deliberately uncached, so it pays for the platform distribution too.
      - uses: ./.github/actions/free-disk-space

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Deliberately uncached. The Actions cache is shared across refs, so
          # restoring one in the job that signs and publishes would let anyone able
          # to poison it from a lower-privileged run influence what ships. Releases
          # are rare; paying the download each time is the right trade. build.yml
          # keeps its cache.
          cache-disabled: true

      # gradle.properties changes for reasons that are not a release — a Gradle
      # version, a JVM arg. Three conditions have to hold; any of them failing means
      # this push was not a release and the job stops without doing anything.
      - name: Decide whether this is a release
        id: decide
        run: |
          version=$(grep '^pluginVersion' gradle.properties | cut -d'=' -f2 | tr -d ' ')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pluginVersion is $version"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # A manual run proves the pipeline without releasing anything.
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: will build and verify, but not tag or release."
            exit 0
          fi
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::notice::v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qE "^## \\[$version\\]" CHANGELOG.md; then
            echo "::notice::CHANGELOG.md has no section for $version, so this is not a prepared release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Will tag and release v$version"

      # A release must not be able to ship something the normal pipeline would reject.
      - name: Test
        run: ./gradlew check --stacktrace

      # A single IDE here. The full matrix runs on every push in build.yml, and the
      # release job cannot hold several IDEs on one runner — it exhausted the disk and
      # took the runner down with it.
      - name: Verify plugin
        run: ./gradlew verifyPlugin -PverifyIde=IU --stacktrace

      # Signing needs credentials this repository may not have yet. An unsigned build
      # still installs from disk, so its absence must not deny people the binary — it
      # only stops the Marketplace upload, which is the publish job's business.
      - name: Check for signing credentials
        id: signing
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
        run: |
          if [ -n "$CERTIFICATE_CHAIN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing credentials; building unsigned."
          fi

      - name: Build
        run: ./gradlew buildPlugin --stacktrace

      - name: Sign
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin verifyPluginSignature --stacktrace

      # The tag is created from the version that merged, and the release carries the
      # ZIP from the moment it exists — so there is no window in which a release is
      # public with nothing to install.
      - name: Tag the release
        if: steps.decide.outputs.release == 'true'
        run: |
          version="${{ steps.decide.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          git push origin "v$version"

      - name: Write the release notes
        if: steps.decide.outputs.release == 'true'
        run: |
          # From the changelog section this release closed, so the release and the
          # repository cannot describe the version differently.
          ./gradlew getChangelog --no-header --no-summary --quiet > /tmp/notes.md
          {
            echo "**Requires an IntelliJ-based IDE 2026.1.4 or newer.** Tested on IntelliJ IDEA, GoLand and Android Studio."
            echo
            echo "Not on the JetBrains Marketplace yet — download the ZIP below and install it with"
            echo "**Settings → Plugins → ⚙ → Install Plugin from Disk…**, then restart."
            echo
            echo "---"
            echo
            cat /tmp/notes.md
          } > /tmp/release-notes.md

      # Same action cnspec uses, for consistency. A pre-release suffix in the version
      # marks it as one, which is also what routes the Marketplace upload to a
      # non-default channel.
      - name: Create the GitHub Release
        if: steps.decide.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.decide.outputs.version }}
          name: v${{ steps.decide.outputs.version }}
          body_path: /tmp/release-notes.md
          files: build/distributions/*.zip
          prerelease: ${{ contains(steps.decide.outputs.version, '-') }}
          make_latest: ${{ !contains(steps.decide.outputs.version, '-') }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: plugin-distribution
          path: build/distributions/*.zip

      # Checked here because a job-level `if` cannot read a secret, so the publish job
      # is gated on this output instead.
      #
      # PUBLISH_TOKEN alone is the requirement. Signing is *not*: the Marketplace
      # accepts an unsigned plugin — its own web upload never asks for a certificate —
      # and the SDK only says to "make sure it is signed", which is advice rather than
      # a gate. This used to require signing too, which meant adding PUBLISH_TOKEN on
      # its own bought nothing and the skip gave no hint why.
      - name: Decide whether this can be published
        id: publishable
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ "${{ steps.decide.outputs.release }}" = "true" ] && [ -n "$PUBLISH_TOKEN" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.signing.outputs.available }}" != "true" ]; then
              echo "::warning::Publishing unsigned. The Marketplace accepts this, but a \
                signature is what lets JetBrains prove the plugin was not modified after \
                you built it. See RELEASING.md."
            fi
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      # Said plainly and where it is read, because a skipped job is easy to miss and
      # "the release is green" must not be mistaken for "it is on the Marketplace".
      - name: Summarise
        if: always()
        run: |
          {
            echo "## Release v${{ steps.decide.outputs.version }}"
            echo
            if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
              echo "- Signed: yes"
            else
              echo "- Signed: **no**. Optional — the Marketplace accepts unsigned plugins."
              echo "  Set \`CERTIFICATE_CHAIN\`, \`PRIVATE_KEY\` and \`PRIVATE_KEY_PASSWORD\` to sign."
            fi
            if [ "${{ steps.publishable.outputs.value }}" = "true" ]; then
              echo "- Marketplace: publishing in the next job."
            else
              echo "- Marketplace: **not published** — \`PUBLISH_TOKEN\` is not set."
              echo "  The plugin is attached to the GitHub Release and installs with"
              echo "  **Install Plugin from Disk…**. See RELEASING.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to JetBrains Marketplace
    needs: build
    if: |
      needs.build.outputs.publishable == 'true' &&
      needs.build.outputs.release == 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.build.outputs.version }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true # same reasoning as the build job

      # The exact file the previous job built, signed and attached to the release —
      # not a rebuild of it. Two builds of one version could differ; this way what
      # someone downloads from GitHub and what the Marketplace serves are the same
      # bytes.
      # The artifact-poisoning rule asks whether attacker-controlled code could have
      # produced this artifact. Here nothing untrusted is ever involved: the workflow
      # runs on a push to main, and the `build` job that produced the artifact checked
      # out a tag on main, so every line that ran to create it was already merged.
      #
      # Note the reason is the trigger and the provenance, NOT that the producer is a
      # job of this same run. Same-run is not by itself safe -- a `pull_request` job
      # that checks out the PR head, runs it, and uploads the result hands the next
      # job a poisoned artifact through `needs` exactly as a cross-run download would.
      # It is the absence of any untrusted input that makes this one safe.
      # push-triggered release; the artifact is built from a merged tag, never from untrusted input nogrep: actions-artifact-poisoning
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-distribution
          path: dist

      - name: Publish
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          # A glob that matches nothing expands to itself, so an empty download would
          # otherwise reach Gradle as a path that does not exist.
          shopt -s nullglob
          archives=(dist/*.zip)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::error::No plugin archive in the downloaded artifact." >&2
            exit 1
          fi
          archive="${archives[0]}"
          echo "Publishing $archive"
          # -x excludes the build and signing tasks: publishPlugin depends on them by
          # default, which would rebuild the very artifact this job exists to reuse.
          # patchChangelog too — publishing must not rewrite the changelog.
          ./gradlew publishPlugin \
            -PpublishArchive="$PWD/$archive" \
            -x buildPlugin -x signPlugin -x patchChangelog \
            --stacktrace

      - name: Summarise
        if: always()
        run: echo "Published to the JetBrains Marketplace." >> "$GITHUB_STEP_SUMMARY"

  # One message per release, when the release is over. The other repositories post at
  # the start and edit that message as jobs finish; here the whole thing is two jobs
  # and a few minutes, so a single terminal message says the same thing without the
  # bookkeeping of carrying a channel and timestamp between jobs.
  #
  # `always()` because a failed release is the one people most need told. On failure it
  # pings @platform; on success it stays quiet enough to skim.
  notify:
    name: Notify Slack
    needs: [build, publish]
    # Nothing to announce for a dry run, or for a push that turned out not to be a new
    # version — those are the common case and would be noise.
    if: always() && needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # C07QZDJFF89 == #release-coordination
      SLACK_BOT_CHANNEL_ID: "C07QZDJFF89"
      # S095M0P5XF1 == @platform
      SLACK_PLATFORM_SUBTEAM_ID: "S095M0P5XF1"
      # A secret cannot be read from an `if:`, so it is lifted into the environment
      # here and tested below. Until SLACK_BOT_TOKEN is granted to this repository the
      # step skips, which must not colour the release red.
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
    steps:
      - name: Work out what to say
        id: meta
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PUBLISHABLE: ${{ needs.build.outputs.publishable }}
          SIGNED: ${{ needs.build.outputs.signed }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          case "$BUILD_RESULT" in
            success) build_status=':white_check_mark: Released' ;;
            skipped) build_status=':double_vertical_bar: Not started' ;;
            *)       build_status=':x: Failed' ;;
          esac

          # A skipped publish is two different things and the difference matters: no
          # Marketplace token yet is expected and fine, whereas a skip after a failed
          # build is a consequence of that failure.
          case "$PUBLISH_RESULT" in
            success) publish_status=':white_check_mark: Live on the Marketplace' ;;
            failure) publish_status=':x: Failed' ;;
            *)
              if [ "$PUBLISHABLE" = 'true' ]; then
                publish_status=':double_vertical_bar: Not started'
              else
                publish_status=':double_vertical_bar: Skipped (no Marketplace token)'
              fi
              ;;
          esac

          if [ "$SIGNED" = 'true' ]; then
            signing_status=':white_check_mark: Signed'
          else
            signing_status=':warning: Unsigned'
          fi

          # Success means the release exists and publishing either worked or was
          # deliberately not attempted.
          if [ "$BUILD_RESULT" = 'success' ] && [ "$PUBLISH_RESULT" != 'failure' ]; then
            failed=false
            header=":rocket: Mondoo plugin v${VERSION} released"
            if [ "$PUBLISH_RESULT" = 'success' ]; then
              summary="Published to the JetBrains Marketplace. It takes a little while to appear while JetBrains reviews the upload."
            else
              summary="On the GitHub release and installable with *Install Plugin from Disk…*. Not sent to the Marketplace."
            fi
          else
            failed=true
            header=":x: Mondoo plugin v${VERSION} release failed"
            summary="The release did not complete. The workflow run below has the failure."
          fi

          {
            echo "failed=${failed}"
            echo "header=${header}"
            echo "summary=${summary}"
            echo "build_status=${build_status}"
            echo "publish_status=${publish_status}"
            echo "signing_status=${signing_status}"
          } >> "$GITHUB_OUTPUT"

      - name: Post release message
        id: post
        if: env.SLACK_BOT_TOKEN != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          # The action's default is `errors: false`, described in its own inputs as
          # "if the step exits with an error on errors or continues". It continues:
          # a rejected call -- a bad channel, a bot that was never invited, an
          # expired token -- gives a green step and no message.
          #
          # That is how v0.3.2 was released with this job reporting success and
          # nothing arriving in Slack. A notification that cannot fail cannot be
          # trusted to have worked, which makes it worse than no notification.
          errors: true
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "${{ env.SLACK_BOT_CHANNEL_ID }}"
            unfurl_links: false
            unfurl_media: false
            text: "${{ steps.meta.outputs.failed == 'true' && format('<!subteam^{0}> ', env.SLACK_PLATFORM_SUBTEAM_ID) || '' }}${{ steps.meta.outputs.header }}"
            blocks:
              - type: "header"
                text:
                  type: "plain_text"
                  text: "${{ steps.meta.outputs.header }}"
                  emoji: true
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "${{ steps.meta.outputs.failed == 'true' && format('<!subteam^{0}> ', env.SLACK_PLATFORM_SUBTEAM_ID) || '' }}${{ steps.meta.outputs.summary }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*Repository:*\n`${{ github.repository }}`"
                  - type: "mrkdwn"
                    text: "*Version:*\n`v${{ needs.build.outputs.version }}`"
                  - type: "mrkdwn"
                    text: "*Triggered by:*\n${{ github.actor }}"
                  - type: "mrkdwn"
                    text: "*Trigger:*\n${{ github.event_name }}"
              - type: "section"
                fields:
                  - type: "mrkdwn"
                    text: "*GitHub release:*\n${{ steps.meta.outputs.build_status }}"
                  - type: "mrkdwn"
                    text: "*Marketplace:*\n${{ steps.meta.outputs.publish_status }}"
                  - type: "mrkdwn"
                    text: "*Plugin signing:*\n${{ steps.meta.outputs.signing_status }}"
              - type: "context"
                elements:
                  - type: "mrkdwn"
                    # No Marketplace link yet: a listing only gets its permanent URL
                    # once JetBrains has approved it, and /plugin/<plugin-id> is not a
                    # working substitute — it 404s. Add it here once the listing is
                    # public and has a numeric id.
                    text: "<https://github.com/${{ github.repository }}/releases/tag/v${{ needs.build.outputs.version }}|Release notes> · <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Workflow run>"

      # Proof, in the log, that Slack accepted it. `errors: true` above turns a
      # rejection into a failed step, and this turns a silent no-op into one too:
      # chat.postMessage returns the channel and the message timestamp, so their
      # absence means nothing was posted however green the step looked.
      - name: Confirm the message was posted
        if: env.SLACK_BOT_TOKEN != ''
        env:
          POSTED_CHANNEL: ${{ steps.post.outputs.channel_id }}
          POSTED_TS: ${{ steps.post.outputs.ts }}
        run: |
          set -euo pipefail
          if [ -z "$POSTED_TS" ]; then
            echo "::error::Slack accepted no message: chat.postMessage returned no timestamp."
            exit 1
          fi
          echo "Posted to channel ${POSTED_CHANNEL} at ts ${POSTED_TS}"
          {
            echo "### Slack"
            echo
            echo "Release announced in \`${POSTED_CHANNEL}\` (ts \`${POSTED_TS}\`)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Note when the notification was skipped
        if: env.SLACK_BOT_TOKEN == ''
        run: |
          {
            echo "### Slack notification skipped"
            echo
            echo "\`SLACK_BOT_TOKEN\` is not available to this repository. Grant the"
            echo "organisation secret to it to have releases announced in"
            echo "#release-coordination."
          } >> "$GITHUB_STEP_SUMMARY"
