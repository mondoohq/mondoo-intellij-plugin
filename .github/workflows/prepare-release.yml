name: Prepare release

# Opens a PR that bumps the version and closes the changelog's Unreleased section.
# main stays PR-only, so this is how a release starts.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 0.2.0 or 1.0.0-beta.1"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1

      - name: Validate the version
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${{ inputs.version }}' is not a semantic version"
            exit 1
          fi

      - name: Bump the version and close the changelog section
        run: |
          sed -i "s/^pluginVersion = .*/pluginVersion = ${{ inputs.version }}/" gradle.properties
          ./gradlew patchChangelog --stacktrace

      - name: Open the release PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore: prepare release v${{ inputs.version }}"
          git push --set-upstream origin "$branch"
          gh pr create \
            --title "chore: prepare release v${{ inputs.version }}" \
            --body "Bumps \`pluginVersion\` to \`${{ inputs.version }}\` and closes the changelog's Unreleased section.

          After merging, create a GitHub Release tagged \`v${{ inputs.version }}\` to publish. Mark it as a pre-release to route it to a non-default Marketplace channel." \
            --base main --head "$branch"
