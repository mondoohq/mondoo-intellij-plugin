# ── Plugin coordinates ───────────────────────────────────────────────────────
pluginGroup = com.mondoo
pluginName = Mondoo
pluginRepositoryUrl = https://github.com/mondoohq/intellij-mondoo
pluginVersion = 0.1.0

# ── Compatibility ────────────────────────────────────────────────────────────
# 261.26222 == IntelliJ 2026.1.4, the first build shipping the open-sourced
# platform LSP client API. Verified present in Android Studio Quail 4
# (AI-261.26222.65) and GoLand 2026.2 (GO-262.9437.286).
pluginSinceBuild = 261.26222
# untilBuild is deliberately left open; see docs/adr/0001.

platformVersion = 2026.1.4

# ── Build ────────────────────────────────────────────────────────────────────
# Platform 261 class files are Java 21 bytecode (major 65), even though the
# bundled JBR is 25.
javaVersion = 21
gradleVersion = 9.2.1

# The platform bundles kotlin-stdlib; bundling our own causes classloader
# conflicts and Plugin Verifier warnings.
kotlin.stdlib.default.dependency = false

org.gradle.caching = true
org.gradle.configuration-cache = true
org.gradle.jvmargs = -Xmx4g -XX:MaxMetaspaceSize=1g
